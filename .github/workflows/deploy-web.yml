name: Build and deploy web to gh-pages

on:
  push:
    branches:
      - claude/niche-website-monetization-t1fpxb
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages

      # GEO (26-11-2026): avisar a Bing (IndexNow) de los artículos nuevos o cambiados; ChatGPT busca en el índice de Bing.
      - name: Avisar a Bing (IndexNow)
        continue-on-error: true
        run: |
          sleep 60
          urls=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'web/src/content/articulos/*.md' 2>/dev/null | while read f; do [ -f "$f" ] && echo "https://mihuertourbano.xyz/articulos/$(basename "$f" .md)/"; done)
          [ -z "$urls" ] && { echo "Nada que avisar"; exit 0; }
          echo "$urls"
          lista=$(echo "$urls" | head -1000 | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          curl -s -o /dev/null -w "IndexNow: %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"mihuertourbano.xyz\",\"key\":\"c39f8bc94e6f3df02f4540fbb060dcd6\",\"keyLocation\":\"https://mihuertourbano.xyz/c39f8bc94e6f3df02f4540fbb060dcd6.txt\",\"urlList\":$lista}"
