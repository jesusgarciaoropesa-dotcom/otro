<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ilustración de un balcón con macetas de huerto urbano">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf1de" />
      <stop offset="100%" stop-color="#eadfc4" />
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8c4a0" />
      <stop offset="100%" stop-color="#c7ac80" />
    </linearGradient>
  </defs>

  <style>
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 2.6s ease-in-out infinite; }
    .sway.d1 { animation-delay: -0.6s; }
    .sway.d2 { animation-delay: -1.3s; }
    .sway.d3 { animation-delay: -1.9s; }
    @keyframes sway {
      0%, 100% { transform: rotate(-7deg); }
      50% { transform: rotate(7deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .sway { animation: none; }
    }
  </style>

  <rect width="1600" height="500" fill="url(#sky)" />
  <circle cx="1420" cy="90" r="120" fill="#d9a441" opacity="0.25" />
  <circle cx="140" cy="60" r="90" fill="#3f6b3a" opacity="0.08" />

  <rect x="0" y="400" width="1600" height="100" fill="url(#floor)" />
  <rect x="0" y="392" width="1600" height="10" fill="#a8562f" opacity="0.5" />

  <!-- maceta 1 -->
  <g transform="translate(180,300)">
    <path d="M0 100 L130 100 L112 180 L18 180 Z" fill="#a8562f" />
    <rect x="-6" y="90" width="142" height="16" rx="6" fill="#7a3d20" />
    <g class="sway">
      <ellipse cx="65" cy="30" rx="70" ry="55" fill="#3f6b3a" />
      <ellipse cx="20" cy="10" rx="34" ry="26" fill="#4f7f49" />
      <ellipse cx="105" cy="14" rx="30" ry="24" fill="#2e5029" />
    </g>
  </g>

  <!-- maceta 2 (mas alta, tomatera) -->
  <g transform="translate(430,250)">
    <path d="M0 150 L110 150 L96 230 L14 230 Z" fill="#c06a3a" />
    <rect x="-6" y="140" width="122" height="16" rx="6" fill="#7a3d20" />
    <g class="sway d1">
      <line x1="55" y1="0" x2="55" y2="145" stroke="#3f6b3a" stroke-width="8" />
      <ellipse cx="55" cy="40" rx="46" ry="34" fill="#4f7f49" />
      <ellipse cx="20" cy="80" rx="30" ry="22" fill="#3f6b3a" />
      <ellipse cx="90" cy="90" rx="28" ry="20" fill="#3f6b3a" />
      <circle cx="30" cy="95" r="10" fill="#c1462f" />
      <circle cx="80" cy="60" r="9" fill="#c1462f" />
    </g>
  </g>

  <!-- maceta 3 con flor mostaza -->
  <g transform="translate(680,320)">
    <path d="M0 90 L100 90 L86 160 L14 160 Z" fill="#a8562f" />
    <rect x="-6" y="80" width="112" height="14" rx="6" fill="#7a3d20" />
    <g class="sway d2">
      <ellipse cx="50" cy="30" rx="55" ry="42" fill="#3f6b3a" />
      <circle cx="50" cy="10" r="16" fill="#d9a441" />
    </g>
  </g>

  <!-- torre vertical de macetas (cultivo vertical) -->
  <g transform="translate(1080,230)">
    <rect x="0" y="150" width="70" height="24" rx="6" fill="#a8562f" />
    <g class="sway d1">
      <ellipse cx="35" cy="150" rx="42" ry="24" fill="#4f7f49" />
    </g>
    <rect x="10" y="90" width="50" height="20" rx="6" fill="#c06a3a" />
    <g class="sway d3">
      <ellipse cx="35" cy="90" rx="34" ry="20" fill="#3f6b3a" />
    </g>
    <rect x="18" y="40" width="34" height="18" rx="6" fill="#a8562f" />
    <g class="sway d2">
      <ellipse cx="35" cy="40" rx="26" ry="16" fill="#4f7f49" />
    </g>
  </g>

  <!-- maceta 4, pequena, aromaticas -->
  <g transform="translate(1290,330)">
    <path d="M0 80 L90 80 L78 140 L12 140 Z" fill="#c06a3a" />
    <rect x="-4" y="72" width="98" height="14" rx="6" fill="#7a3d20" />
    <g class="sway d3">
      <ellipse cx="45" cy="35" rx="48" ry="38" fill="#4f7f49" />
      <ellipse cx="20" cy="20" rx="20" ry="16" fill="#3f6b3a" />
    </g>
  </g>
</svg>
